[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vyom"
version = "0.1.0"
description = "Offline-first camera-based experiment monitoring system for human activity recognition and procedure compliance."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "VYOM Project Team" }
]
license = { text = "Research / Prototype License" }
keywords = [
    "computer-vision",
    "procedure-compliance",
    "human-activity-recognition",
    "yolov8-obb",
    "mediapipe",
    "aruco",
    "deterministic-engine",
    "offline-first"
]

# ==============================================================================
# Dependency Groups
# ==============================================================================

# Core runtime dependencies: Lightweight configuration, schema validation, and logging
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
# Desktop dependencies: PySide6 Qt Widgets GUI and local offline TTS voice engine
desktop = [
    "PySide6>=6.6.0,<6.8.0",
    "pyttsx3>=2.90",
]

# Computer vision dependencies: OpenCV contrib (ArUco), MediaPipe, ONNX Runtime CPU, NumPy
vision = [
    "opencv-contrib-python>=4.8.0.76,<5.0.0.0",
    "mediapipe>=0.10.9",
    "onnxruntime>=1.16.0,<2.0.0",
    "numpy>=1.24.0,<2.0.0",
]

# Optional GPU execution provider (NVIDIA CUDA acceleration for ONNX Runtime)
gpu = [
    "onnxruntime-gpu>=1.16.0,<2.0.0",
]

# Optional training dependencies: PyTorch, TorchVision, Ultralytics YOLOv8
# Kept separate from the final desktop application dependencies
training = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.1.0",
]

# Development & testing dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black>=23.9.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

# Full local runtime suite (desktop GUI + computer vision on CPU fallback)
all = [
    "vyom[desktop,vision]",
]

[project.scripts]
vyom = "vyom.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
